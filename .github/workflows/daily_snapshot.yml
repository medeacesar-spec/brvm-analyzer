name: Daily Snapshot Build

on:
  schedule:
    - cron: "0 16 * * 1-5"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # OCR des rapports scannes (cf packages.txt cote Streamlit Cloud).
      # Sans ces paquets, extract_pending_pubs laisse tomber tout PDF image.
      - name: Install tesseract (OCR)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/build_daily_snapshot.py
