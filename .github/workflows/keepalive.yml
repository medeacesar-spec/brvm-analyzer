name: Streamlit Keep-Alive

# Streamlit Community Cloud endort une app apres ~12h sans session WebSocket.
# On ouvre donc une vraie session navigateur toutes les 3h, 7j/7 (les jobs
# metier ne tournent qu'en semaine 9h-16h UTC, ce qui laissait 18h de trou la
# nuit et 66h le week-end).
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

concurrency:
  group: streamlit-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Volontairement sans requirements.txt : ce job n'a besoin que de
      # playwright, il doit rester leger et rapide.
      - name: Install Playwright + Chromium
        run: |
          pip install "playwright>=1.40,<2"
          playwright install --with-deps chromium
      - name: Session Streamlit
        run: python scripts/keepalive.py
